name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href /angular-the-story-teller/

      # Let Angular handle direct links and page reloads on nested routes.
      - name: Add route fallback
        run: cp dist/newspaper/browser/index.html dist/newspaper/browser/404.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/newspaper/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
