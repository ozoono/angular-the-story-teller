<section class="article-page">
  @if (viewState(); as state) {
    @if (state.kind === 'not-found') {
      <h1>Article not found</h1>
    } @else if (state.kind === 'loading') {
      <p role="status">Loading article…</p>
    } @else if (state.kind === 'error') {
      <p role="alert">Unable to load this article.</p>
      <button type="button" (click)="onRetry()">Try again</button>
    } @else {
      <app-article-content [article]="state.article" [topic]="topic()" />
    }
  }
  <aside class="article-page__sidebar" aria-label="Ads">
    <app-ads></app-ads>
  </aside>
</section>
