<footer class="footer">
  <ul class="footer__sections">
    @for (category of categories; track category) {
      <li>
        <a
          class="footer__link"
          href="/category/{{ category.toLowerCase() }}"
          [routerLink]="['/category', category.toLowerCase()]"
        >
          {{ category }}</a>
      </li>
    }
  </ul>

  <div class="footer__brand">
    <a href="/" routerLink="/">
      <img src="/logo.webp" alt="The StoryTeller" width="200"/>
    </a>
    <p>&copy; {{ currentYear }} The StoryTeller.<br/>All rights reserved.</p>
    <app-github />
  </div>
</footer>
