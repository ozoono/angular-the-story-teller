<article class="lead-story-card">
  <a
    class="lead-story-card__link"
    href="/{{ article().category?.toLowerCase() }}/article/{{ article().id }}"
    [routerLink]="['/', article().category?.toLowerCase(), 'article', article().id]"
  >
    @if (article().photoUrl; as photoUrl) {
      <img
        class="lead-story-card__photo"
        [src]="photoUrl"
        alt="{{ article().photoAlt ?? article().title }}"
      />
    }

    <h2 class="lead-story-card__title">{{ article().title }}</h2>

    @if (article().summary; as summary) {
      <p class="lead-story-card__summary">{{ summary }}</p>
    }

    @if (hasBottom()) {
      <div class="lead-story-card__bottom">
        @if (article().author; as author) {
          <app-news-author [text]="author" />
        }

        @if (article().source; as source) {
          <app-news-source [text]="source" />
        }
      </div>
    }
  </a>
</article>
